name: RPM builder image

# Builds the Fedora 44 RPM builder image from packaging/rpm/builder, pushes it
# to the GitHub Container Registry, attests the pushed digest, and proposes
# the new digest for packaging/rpm/builder/image.json in one pull request.
# It never runs on pull requests, and only main can publish.
on:
  schedule:
    # Weekly, Sunday 04:37 UTC, off the top of the hour.
    - cron: "37 4 * * 0"
  workflow_dispatch:
  push:
    branches:
      - main
    # The pin file is excluded: merging a pin pull request must not rebuild
    # the image, or every pin would publish a new digest and open another pin.
    paths:
      - packaging/rpm/builder/**
      - "!packaging/rpm/builder/image.json"
      - .github/workflows/rpm-builder-image.yml

permissions: {}

concurrency:
  group: rpm-builder-image
  cancel-in-progress: false

env:
  BUILDER_IMAGE: ghcr.io/andre-motta/tongs-rpm-builder
  FEDORA_IMAGE: registry.fedoraproject.org/fedora:44
  PIN_BRANCH: automation/rpm-builder-pin

jobs:
  build:
    name: Build, push and attest the builder image
    if: github.ref == 'refs/heads/main' && github.repository == 'andre-motta/tongs'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    outputs:
      digest: ${{ steps.push.outputs.digest }}
      tag: ${{ steps.build.outputs.tag }}
      base-digest: ${{ steps.base.outputs.digest }}
    steps:
      - name: Check out the exact source without persisted credentials
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
          persist-credentials: false
      - name: Require the package list to match the RPM sources
        run: python3 -I packaging/rpm/builder/build_requires.py --check
      - name: Resolve the current Fedora 44 base digest
        id: base
        run: |
          set -euo pipefail
          digest=$(skopeo inspect --format '{{.Digest}}' "docker://$FEDORA_IMAGE")
          [[ "$digest" =~ ^sha256:[0-9a-f]{64}$ ]] || {
            printf 'unexpected base digest: %s\n' "$digest" >&2
            exit 1
          }
          printf 'digest=%s\n' "$digest" >> "$GITHUB_OUTPUT"
      - name: Build the image from the pinned base
        id: build
        env:
          BASE_DIGEST: ${{ steps.base.outputs.digest }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          tag="fedora44-$(date -u +%Y%m%d)-${GITHUB_SHA::12}"
          podman build \
            --build-arg "FEDORA_DIGEST=$BASE_DIGEST" \
            --build-arg "SOURCE_COMMIT=$GITHUB_SHA" \
            --tag "$BUILDER_IMAGE:$tag" \
            --file packaging/rpm/builder/Containerfile \
            packaging/rpm/builder
          labels=$(podman image inspect "$BUILDER_IMAGE:$tag" --format \
            '{{index .Labels "org.opencontainers.image.revision"}} {{index .Labels "org.opencontainers.image.base.digest"}}')
          test "$labels" = "$GITHUB_SHA $BASE_DIGEST"
          printf 'tag=%s\n' "$tag" >> "$GITHUB_OUTPUT"
      - name: Log in to the GitHub Container Registry
        env:
          REGISTRY_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          # One runner-scoped credential file that podman and the attest
          # action both read; it is removed at the end of the job.
          auth_dir="$RUNNER_TEMP/registry-auth"
          install -d -m 700 "$auth_dir"
          printf 'DOCKER_CONFIG=%s\n' "$auth_dir" >> "$GITHUB_ENV"
          printf 'REGISTRY_AUTH_FILE=%s/config.json\n' "$auth_dir" >> "$GITHUB_ENV"
          printf '%s' "$REGISTRY_TOKEN" | podman login ghcr.io \
            --authfile "$auth_dir/config.json" \
            --username "$GITHUB_ACTOR" --password-stdin
      - name: Push the image and record its digest
        id: push
        env:
          TAG: ${{ steps.build.outputs.tag }}
        run: |
          set -euo pipefail
          digest_file="$RUNNER_TEMP/builder-image.digest"
          podman push --digestfile "$digest_file" "$BUILDER_IMAGE:$TAG"
          digest=$(cat "$digest_file")
          [[ "$digest" =~ ^sha256:[0-9a-f]{64}$ ]] || {
            printf 'unexpected pushed digest: %s\n' "$digest" >&2
            exit 1
          }
          printf 'digest=%s\n' "$digest" >> "$GITHUB_OUTPUT"
          printf "Pushed \`%s:%s\` as \`%s\`.\n" "$BUILDER_IMAGE" "$TAG" "$digest" \
            >> "$GITHUB_STEP_SUMMARY"
      - name: Attest the pushed digest
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-name: ${{ env.BUILDER_IMAGE }}
          subject-digest: ${{ steps.push.outputs.digest }}
          push-to-registry: true
          create-storage-record: false
          show-summary: true
      - name: Remove the registry credentials
        if: ${{ always() }}
        run: |
          podman logout --authfile "$RUNNER_TEMP/registry-auth/config.json" ghcr.io || true
          rm -rf -- "$RUNNER_TEMP/registry-auth"

  pin:
    name: Propose the new builder pin
    needs: build
    if: github.ref == 'refs/heads/main' && github.repository == 'andre-motta/tongs'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Check out the exact source without persisted credentials
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
          persist-credentials: false
      - name: Rewrite the pin
        id: pin
        env:
          DIGEST: ${{ needs.build.outputs.digest }}
          TAG: ${{ needs.build.outputs.tag }}
          BASE_DIGEST: ${{ needs.build.outputs.base-digest }}
        run: |
          set -euo pipefail
          python3 -I scripts/pin_rpm_builder.py \
            --digest "$DIGEST" \
            --tag "$TAG" \
            --base-digest "$BASE_DIGEST" \
            --source-commit "$GITHUB_SHA" \
            --run-id "$GITHUB_RUN_ID" >> "$GITHUB_OUTPUT"
          python3 -I scripts/pin_rpm_builder.py --check
      - name: Open or update the pin pull request
        if: steps.pin.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          DIGEST: ${{ needs.build.outputs.digest }}
          TAG: ${{ needs.build.outputs.tag }}
        run: |
          set -euo pipefail
          title="Pin the RPM builder image $TAG"
          body="$RUNNER_TEMP/pin-pull-request.md"
          {
            printf "Pins \`%s@%s\` (tag \`%s\`), built and attested by %s.\n\n" \
              "$BUILDER_IMAGE" "$DIGEST" "$TAG" \
              "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
            printf 'Opened by the RPM builder image workflow. Approve the CI run, '
            printf 'which must pass the full graph, then review and merge as usual.\n'
          } > "$body"
          git -c user.name='github-actions[bot]' \
            -c user.email='41898282+github-actions[bot]@users.noreply.github.com' \
            commit --signoff --quiet \
            --message "$title" \
            --message "Pin the RPM builder image to the digest the scheduled build published." \
            -- packaging/rpm/builder/image.json
          git -c credential.helper= -c 'credential.helper=!gh auth git-credential' \
            push --force origin "HEAD:refs/heads/$PIN_BRANCH"
          existing=$(gh pr list --repo "$GITHUB_REPOSITORY" --head "$PIN_BRANCH" \
            --base main --state open --json number --jq '.[0].number // empty')
          if [[ -n "$existing" ]]; then
            gh pr edit "$existing" --repo "$GITHUB_REPOSITORY" \
              --title "$title" --body-file "$body"
          else
            gh pr create --repo "$GITHUB_REPOSITORY" --base main \
              --head "$PIN_BRANCH" --title "$title" --body-file "$body"
          fi
